<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kart Party</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Bangers&display=swap" rel="stylesheet">
<style>
:root{--ink:#111;--y:#ffeb3b}
html,body{margin:0;height:100%;background:#111;color:#fff;font-family:system-ui,sans-serif;overflow:hidden}
#gl{position:fixed;inset:0;display:block}
.bd{font-family:Bangers,Impact,system-ui,sans-serif;letter-spacing:.06em}
h1,h2,.card b,.msg,#msg,#big,.vp,.boom,.res td{font-family:Bangers,Impact,system-ui,sans-serif;letter-spacing:.05em}
/* Panneau façon case de BD avec trame de points */
#ui{position:fixed;inset:3vh 3vw;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.6vh;text-align:center;
 background:radial-gradient(circle,rgba(0,0,0,.13) 1.5px,transparent 1.6px) 0 0/14px 14px,linear-gradient(160deg,#fff7c2,#ffd166);color:var(--ink);
 border:.7vh solid var(--ink);border-radius:2vh;box-shadow:1.2vh 1.2vh 0 var(--ink);overflow:auto;padding:2vh 2vw;box-sizing:border-box}
#ui.hide{display:none}
#ui h1{font-size:9vh;margin:0;color:#e53935;-webkit-text-stroke:.35vh var(--ink);text-shadow:.6vh .6vh 0 var(--ink);transform:rotate(-2deg)}
#ui h2{font-size:3.6vh;margin:1vh 0 0}
.lob{display:flex;gap:4vw;align-items:center;justify-content:center;flex-wrap:wrap}
#qr{background:#fff;padding:1.5vh;border-radius:1vh;border:.5vh solid var(--ink);box-shadow:.8vh .8vh 0 var(--ink);transform:rotate(1.5deg)}#qr img{width:28vh;height:28vh;display:block}
#pl{display:grid;grid-template-columns:repeat(2,minmax(24vw,1fr));gap:1.6vh}
.card{display:flex;align-items:center;gap:1.4vh;padding:1.2vh 1.6vh;border-radius:1.4vh;background:#fff;border:.45vh solid var(--ink);border-left:2.2vh solid var(--c);box-shadow:.6vh .6vh 0 var(--ink);text-align:left}
.card img{width:8vh;height:8vh}.card b{font-size:3.6vh;display:block;font-weight:normal}.card small{font-size:2vh;opacity:.75}
.empty{grid-column:span 2;font-size:2.6vh;opacity:.6}
#msg,.msg{font-size:3.2vh;background:var(--ink);color:var(--y);padding:.8vh 2vh;border-radius:1vh;transform:rotate(-1deg)}
#opts{font-size:2vh;opacity:.8}#url{font-size:1.5vh;opacity:.55;word-break:break-all}
/* Résultats / podium */
.cols{display:flex;gap:3vw;flex-wrap:wrap;justify-content:center}
.res table{border-collapse:separate;border-spacing:0 .6vh;font-size:2.8vh;min-width:36vw}
.res td{background:#fff;padding:.4vh 1.6vh;border-top:.35vh solid var(--ink);border-bottom:.35vh solid var(--ink)}
.res td:first-child{border-left:1.6vh solid var(--c);border-radius:1vh 0 0 1vh}.res td:last-child{border-right:.35vh solid var(--ink);border-radius:0 1vh 1vh 0}
.res td img{width:4.5vh;height:4.5vh;vertical-align:middle}.res .nm{text-align:left;width:100%}.res .g{color:#e53935;white-space:nowrap}
.podium{display:flex;align-items:flex-end;gap:2vw;margin-top:2vh}
.step{display:flex;flex-direction:column;align-items:center;gap:.6vh;width:20vw}.step img{width:14vh;height:14vh;animation:bob 1s ease-in-out infinite alternate}
.step b{font-size:4vh;font-family:Bangers,Impact,sans-serif;font-weight:normal}.step small{font-size:2.4vh}
.blk{width:100%;background:var(--c);border:.5vh solid var(--ink);border-radius:1vh 1vh 0 0;font:10vh Bangers,Impact,sans-serif;color:#fff;-webkit-text-stroke:.3vh var(--ink);box-shadow:.8vh .8vh 0 var(--ink)}
.s1 .blk{height:30vh}.s2 .blk{height:20vh}.s3 .blk{height:13vh}
@keyframes bob{to{transform:translateY(-1.5vh) rotate(4deg)}}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden}.confetti i{position:absolute;top:-3vh;width:1.4vh;height:2.2vh;animation:fall 3.5s linear infinite;border:2px solid var(--ink)}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
/* HUD de chaque vue */
#huds{position:fixed;inset:0;pointer-events:none}
.vp{position:absolute;box-sizing:border-box;box-shadow:inset 0 0 0 .5vh var(--ink);overflow:hidden}
.vp .pos{position:absolute;left:1.5vh;top:.5vh;font-size:13vh;line-height:1;color:var(--y);-webkit-text-stroke:.35vh var(--ink);text-shadow:.6vh .6vh 0 var(--ink)}
.vp .pos sup{font-size:.4em}.vp .pos small{font-size:.3em;color:#fff}
.vp .lap{position:absolute;right:1.5vh;top:1.5vh;font-size:5vh;background:#fff;color:var(--ink);border:.4vh solid var(--ink);border-radius:1vh;padding:0 1.2vh;box-shadow:.5vh .5vh 0 var(--ink);transform:rotate(2deg)}
.vp .slot{position:absolute;left:50%;top:1.5vh;transform:translateX(-50%);width:10vh;height:10vh;border-radius:50%;background:#fff;border:.5vh solid var(--ink);box-shadow:.5vh .5vh 0 var(--ink);display:flex;align-items:center;justify-content:center;font-size:6vh}
.vp .slot.empty{opacity:.45}
.vp .tag{position:absolute;left:1.5vh;top:15vh;font-size:3vh;background:var(--c);border:.4vh solid var(--ink);border-radius:1vh;padding:.2vh 1vh;display:flex;align-items:center;gap:.8vh;color:#fff;-webkit-text-stroke:.12vh var(--ink)}
.vp .tag img{width:4vh;height:4vh}
.vp.off::after{content:'📡 Manette déconnectée — pilote auto';position:absolute;left:50%;top:14vh;transform:translateX(-50%);background:var(--ink);color:var(--y);padding:.6vh 1.6vh;border-radius:1vh;font-size:2.8vh}
.vp.boost::before{content:'';position:absolute;inset:-20%;background:repeating-conic-gradient(from 0deg,rgba(255,255,255,.55) 0 1.2deg,transparent 1.2deg 9deg);
 -webkit-mask:radial-gradient(circle,transparent 38%,#000 72%);mask:radial-gradient(circle,transparent 38%,#000 72%);animation:spd .15s linear infinite}
@keyframes spd{to{transform:rotate(4deg)}}
.boom{position:absolute;left:50%;top:38%;font-size:11vh;color:var(--c);-webkit-text-stroke:.35vh var(--ink);text-shadow:.7vh .7vh 0 var(--ink);white-space:nowrap;animation:boom 1s ease-out forwards}
@keyframes boom{0%{transform:translate(-50%,-50%) rotate(var(--r)) scale(.2)}15%{transform:translate(-50%,-50%) rotate(var(--r)) scale(1.25)}25%{transform:translate(-50%,-50%) rotate(var(--r)) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-70%) rotate(var(--r)) scale(1)}}
#big{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-size:24vh;color:var(--y);-webkit-text-stroke:.6vh var(--ink);text-shadow:1.2vh 1.2vh 0 var(--ink);pointer-events:none}
#mini{position:fixed;right:2vh;bottom:2vh;width:24vh;height:24vh;pointer-events:none}
#mini.mid{left:50%;top:50%;right:auto;bottom:auto;transform:translate(-50%,-50%);width:20vh;height:20vh}
#cmt{position:fixed;left:50%;bottom:2.5vh;transform:translateX(-50%) scale(.6);opacity:0;display:flex;align-items:flex-end;gap:1.5vh;pointer-events:none;transition:.25s cubic-bezier(.3,1.6,.6,1);max-width:70vw;z-index:4}
#cmt.on{opacity:1;transform:translateX(-50%) scale(1)}
#cmt .av{flex:none;width:10vh;height:10vh;border-radius:50%;background:#ffeb3b;border:.5vh solid var(--ink);box-shadow:.5vh .5vh 0 var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:5vh;line-height:1}
#cmt .av small{font:2vh Bangers,Impact,sans-serif;color:var(--ink)}
#cmt p{position:relative;margin:0 0 3vh;background:#fff;color:var(--ink);border:.5vh solid var(--ink);border-radius:2.5vh;padding:1.2vh 2.4vh;font:4vh Bangers,Impact,system-ui,sans-serif;letter-spacing:.04em;box-shadow:.7vh .7vh 0 var(--ink)}
#cmt p::before{content:'';position:absolute;left:-2.6vh;bottom:1.5vh;border:1.3vh solid transparent;border-right:2vh solid var(--ink)}
#toast{display:none;position:fixed;bottom:2vh;left:50%;transform:translateX(-50%);background:#111;color:#ffeb3b;padding:.8vh 2vh;border-radius:1vh;font-size:2.4vh;z-index:5}
#net{display:none;position:fixed;top:1vh;left:50%;transform:translateX(-50%);background:#e53935;padding:.8vh 2vh;border-radius:1vh;font-size:2.2vh;border:.3vh solid var(--ink)}
</style>
<div id=ui><h1>🏎️ Kart Party !</h1>
 <div class=lob><div><div id=qr></div><p style="font-size:2.4vh;margin:1.4vh 0 .4vh">Scanne le QR code avec ton téléphone</p><div id=url></div></div><div id=pl></div></div>
 <div id=msg></div><div id=opts></div></div>
<div id=huds></div><div id=big></div><canvas id=mini width=240 height=240></canvas><div id=net></div><div id=cmt><div class=av>🎙️<small>Gégé</small></div><p></p></div><div id=toast></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script src="shared.js"></script><script src="audio.js"></script><script src="commentator.js"></script><script src="toon.js"></script><script src="tracks.js"></script><script src="game.js"></script>
